<!doctype html>
<!--
  The phone screenshot drop page (phone-screenshot-drop U7).

  ONE self-contained file, embedded with include_str! (KTD10). It is NOT part
  of the Vite pipeline that builds fly's webview and must not acquire a
  dependency on it: no build step, no bundler entry, no imports. That keeps the
  page versioned with the server that speaks to it and needs no runtime asset
  lookup or data-root dependency.

  Served UNAUTHENTICATED (KTD3, R19) — the second deliberate exception to the
  feed's auth-precedes-routing invariant, after /healthz. Safe for the same
  reason: this shell carries no roster, no agent data, and no token, so serving
  it discloses nothing. Every DATA request from it carries the bearer header
  normally, which is what keeps R9 intact.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>fly · drop</title>
    <style>
      :root {
        --bg: #14161a;
        --panel: #1c1f26;
        --panel-2: #232733;
        --line: #2e3440;
        --fg: #e6e9ef;
        --dim: #9aa3b2;
        --accent: #6ea8fe;
        --ok: #4ade80;
        --warn: #fbbf24;
        --bad: #f87171;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        /* Respect the notch/home indicator without a library. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main { max-width: 34rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
      h1 {
        font-size: 1.05rem; font-weight: 600; letter-spacing: .02em;
        margin: .25rem 0 1rem; color: var(--dim);
      }
      h1 b { color: var(--fg); font-weight: 600; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        border-radius: var(--radius); padding: .9rem; margin-bottom: .9rem;
      }
      label { display: block; font-size: .8rem; color: var(--dim); margin-bottom: .4rem; }
      input[type="text"], input[type="password"], textarea {
        width: 100%; background: var(--panel-2); color: var(--fg);
        border: 1px solid var(--line); border-radius: 8px; padding: .7rem;
        font: inherit; /* 16px keeps iOS Safari from zooming on focus */
      }
      textarea { resize: vertical; min-height: 4.5rem; }
      button {
        font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid transparent;
        padding: .85rem 1rem; width: 100%; cursor: pointer;
        background: var(--accent); color: #0b1020;
        /* A big target: this is used one-handed, outdoors. */
        min-height: 3rem;
      }
      button.secondary { background: var(--panel-2); color: var(--fg); border-color: var(--line); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .agents { display: flex; flex-direction: column; gap: .5rem; }
      .agent {
        display: flex; gap: .7rem; align-items: flex-start; text-align: left;
        width: 100%; padding: .7rem; border-radius: 10px;
        background: var(--panel-2); border: 1px solid var(--line);
        color: var(--fg); font: inherit; cursor: pointer; min-height: 0;
      }
      .agent[aria-pressed="true"] { border-color: var(--accent); background: #223049; }
      .agent:disabled { opacity: .5; cursor: not-allowed; }
      .agent .who { flex: 1; min-width: 0; }
      .agent .name { font-weight: 600; font-size: .95rem; }
      .agent .meta {
        font-size: .78rem; color: var(--dim); margin-top: .15rem;
        overflow-wrap: anywhere;
      }
      .dot { width: .6rem; height: .6rem; border-radius: 50%; margin-top: .45rem; flex: none; }
      .dot.working { background: var(--accent); }
      .dot.waiting { background: var(--warn); }
      .dot.idle, .dot.running { background: var(--dim); }
      .note { font-size: .82rem; color: var(--dim); }
      .banner { border-radius: 10px; padding: .7rem .8rem; font-size: .88rem; margin-bottom: .9rem; }
      .banner.ok { background: #17301f; color: var(--ok); border: 1px solid #245234; }
      .banner.bad { background: #331c1c; color: var(--bad); border: 1px solid #5b2a2a; }
      .banner.warn { background: #332a14; color: var(--warn); border: 1px solid #5b4a20; }
      .preview {
        margin-top: .6rem; border-radius: 8px; overflow: hidden;
        border: 1px solid var(--line); background: var(--panel-2);
      }
      .preview img { display: block; width: 100%; max-height: 40vh; object-fit: contain; }
      .row { display: flex; gap: .5rem; align-items: center; }
      .row > * { flex: 1; }
      .hidden { display: none !important; }
      .spinner {
        width: 1rem; height: 1rem; border-radius: 50%; display: inline-block;
        border: 2px solid rgba(0,0,0,.25); border-top-color: #0b1020;
        animation: spin .7s linear infinite; vertical-align: -2px; margin-right: .4rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1><b>fly</b> · drop a screenshot</h1>

      <!-- Token entry. Shown until a token is stored and accepted. -->
      <section id="auth" class="card hidden">
        <label for="token">Feed token</label>
        <input id="token" type="password" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" inputmode="text" />
        <p class="note" style="margin:.6rem 0 .8rem">
          From <code>feed.token</code> in fly's config on the desktop machine.
        </p>
        <button id="save-token">Connect</button>
      </section>

      <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

      <!-- The main compose surface. -->
      <section id="compose" class="hidden">
        <div class="card">
          <label>Send to</label>
          <div id="agents" class="agents"></div>
          <p id="roster-note" class="note hidden" style="margin:.6rem 0 0"></p>
        </div>

        <div class="card">
          <label for="file">Screenshot</label>
          <!--
            No `capture` attribute, deliberately: `capture` opens the camera
            directly and denies the photo library, which is the exact opposite
            of picking a screenshot (MDN). `accept` stays broad rather than
            enumerating types — a narrow accept greys out camera-roll assets
            with no explanation, and naming image/heic has been observed to make
            Safari transcode PNGs INTO HEIC. No `multiple`.
          -->
          <input id="file" type="file" accept="image/*" />
          <div id="preview" class="preview hidden"><img id="preview-img" alt="" /></div>
          <p id="file-note" class="note hidden" style="margin:.6rem 0 0"></p>
        </div>

        <div class="card">
          <label for="caption">What's wrong (optional)</label>
          <textarea id="caption" maxlength="512"
                    placeholder="The login button overlaps the header."></textarea>
        </div>

        <button id="send" disabled>Send</button>
        <p class="note" style="margin:.7rem 0 0" id="conn-note"></p>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        // Every URL is relative to the document, so the page survives being
        // mounted at a subpath even though the documented setup uses a root
        // mount on its own port (KTD9).
        const FEED_URL = "feed";
        const DROP_URL = "drop";

        // Mirrors the backend cap (feed.dropMaxBytes default). Checking here is
        // what actually spares the user the upload: fly's own 413 is prompt but
        // still reads the body, so a pre-send check is the only thing that
        // avoids pushing 30 MB over cellular to be told no.
        const MAX_BYTES = 25 * 1024 * 1024;
        const CAPTION_MAX = 512;
        // A roster older than this is treated as stale. The webview publishes
        // about every 1.5s; a few multiples of that distinguishes "idle" from
        // "frozen" without flapping.
        const STALE_AFTER_MS = 12000;

        // ---- token storage -------------------------------------------------
        // All storage access goes through this one accessor so the deferred
        // swap to a server-issued HttpOnly cookie stays a local change. WebKit
        // purges script-writable storage after ~7 days without interaction, so
        // the user re-pastes occasionally; that is the accepted cost of not
        // building a session-issuing route and a revocation surface for a
        // single-user tool.
        const store = {
          get() {
            try { return localStorage.getItem("fly.feedToken") || ""; }
            catch { return ""; }
          },
          set(v) {
            try { localStorage.setItem("fly.feedToken", v); } catch { /* private mode */ }
          },
          clear() {
            try { localStorage.removeItem("fly.feedToken"); } catch { /* ignore */ }
          },
        };

        const $ = (id) => document.getElementById(id);
        const els = {
          auth: $("auth"), token: $("token"), saveToken: $("save-token"),
          banner: $("banner"), compose: $("compose"), agents: $("agents"),
          rosterNote: $("roster-note"), file: $("file"), preview: $("preview"),
          previewImg: $("preview-img"), fileNote: $("file-note"),
          caption: $("caption"), send: $("send"), connNote: $("conn-note"),
        };

        let token = store.get();
        let agents = [];
        let publishedAt = null;
        let selectedLeaf = null;
        let picked = null;      // the File
        let previewUrl = null;
        let sending = false;
        let connected = false;

        // ---- view ----------------------------------------------------------

        function banner(kind, text) {
          if (!text) { els.banner.classList.add("hidden"); return; }
          els.banner.className = "banner " + kind;
          els.banner.textContent = text;
        }

        function rosterStale() {
          return publishedAt !== null && Date.now() - publishedAt > STALE_AFTER_MS;
        }

        function selected() {
          return agents.find((a) => a.leafKey === selectedLeaf) || null;
        }

        function renderAgents() {
          els.agents.textContent = "";
          if (!connected) {
            els.rosterNote.textContent = "Connecting…";
            els.rosterNote.classList.remove("hidden");
            return;
          }
          if (agents.length === 0) {
            // AE12: say so explicitly rather than showing an empty picker that
            // looks broken.
            els.rosterNote.textContent = "No agents are running right now.";
            els.rosterNote.classList.remove("hidden");
            return;
          }
          els.rosterNote.classList.toggle("hidden", !rosterStale());
          if (rosterStale()) {
            els.rosterNote.textContent =
              "This list may be out of date — fly's window isn't updating. Sending is paused.";
          }

          for (const a of agents) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "agent";
            // A row with no pane id yet cannot be targeted: the drop would be
            // refused after a full upload, so it is disabled rather than
            // selectable.
            const starting = a.paneId === null || a.paneId === undefined;
            btn.disabled = starting || rosterStale();
            btn.setAttribute("aria-pressed", String(a.leafKey === selectedLeaf));

            const dot = document.createElement("span");
            dot.className = "dot " + (a.status || "idle");
            btn.appendChild(dot);

            const who = document.createElement("span");
            who.className = "who";
            const name = document.createElement("span");
            name.className = "name";
            // R4: two sessions in the same directory must be tellable apart, so
            // workspace and tab lead rather than cwd.
            name.textContent =
              (a.num !== null && a.num !== undefined ? a.num + " · " : "") +
              (a.workspace || "?") + " / " + (a.tab || "?");
            who.appendChild(name);

            const meta = document.createElement("span");
            meta.className = "meta";
            const bits = [];
            if (a.cwd) bits.push(a.cwd);
            bits.push(starting ? "still starting" : (a.status || "idle"));
            if (a.needsAttention && a.reason) bits.push("needs you: " + a.reason);
            meta.textContent = bits.join(" · ");
            who.appendChild(meta);

            btn.appendChild(who);
            btn.addEventListener("click", () => {
              selectedLeaf = a.leafKey;
              render();
            });
            els.agents.appendChild(btn);
          }
        }

        function render() {
          els.auth.classList.toggle("hidden", !!token);
          els.compose.classList.toggle("hidden", !token);
          renderAgents();

          els.preview.classList.toggle("hidden", !previewUrl);
          if (previewUrl) els.previewImg.src = previewUrl;

          const a = selected();
          els.send.disabled =
            sending || !picked || !a || a.paneId === null || a.paneId === undefined || rosterStale();
          els.send.textContent = sending ? "Sending…" : "Send";
          if (sending) {
            const s = document.createElement("span");
            s.className = "spinner";
            els.send.prepend(s);
          }
          els.connNote.textContent = connected
            ? (agents.length + " agent" + (agents.length === 1 ? "" : "s") + " live")
            : "";
        }

        // ---- roster stream --------------------------------------------------
        // `fetch` + a stream reader rather than EventSource, for two reasons
        // (KTD3): EventSource cannot set request headers, so the bearer token
        // could not ride the request at all; and it hides the status code
        // behind a silent infinite reconnect, so an expired token would look
        // identical to a network blip instead of surfacing as "re-enter token".
        let streamGeneration = 0;

        async function streamRoster() {
          const mine = ++streamGeneration;
          let backoff = 1000;
          while (mine === streamGeneration && token) {
            try {
              const res = await fetch(FEED_URL, {
                headers: { Authorization: "Bearer " + token },
                cache: "no-store",
              });
              if (res.status === 401) {
                // Deliberately terminal: no auto-retry. A retry storm against
                // an endpoint that writes into shells is the wrong failure
                // mode, and the user's picked image and caption stay in memory
                // so nothing is lost by stopping here.
                token = "";
                store.clear();
                connected = false;
                banner("bad", "That token was rejected. Paste it again.");
                render();
                return;
              }
              if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

              backoff = 1000;
              connected = true;
              banner("", "");
              render();

              const reader = res.body.getReader();
              const decoder = new TextDecoder();
              let buf = "";
              while (mine === streamGeneration) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                // SSE frames are separated by a blank line.
                let idx;
                while ((idx = buf.indexOf("\n\n")) !== -1) {
                  const frame = buf.slice(0, idx);
                  buf = buf.slice(idx + 2);
                  applyFrame(frame);
                }
              }
            } catch {
              // A stream error backs off and reconnects; only a 401 stops.
              connected = false;
              banner("warn", "Lost the connection to fly. Retrying…");
              render();
              await new Promise((r) => setTimeout(r, backoff));
              backoff = Math.min(backoff * 2, 15000);
            }
          }
        }

        function applyFrame(frame) {
          const line = frame.split("\n").find((l) => l.startsWith("data:"));
          if (!line) return; // keepalive comment
          let snap;
          try { snap = JSON.parse(line.slice(5).trim()); } catch { return; }
          if (!snap || !Array.isArray(snap.agents)) return;
          agents = snap.agents;
          publishedAt = typeof snap.publishedAt === "number" ? snap.publishedAt : null;
          if (selectedLeaf && !agents.some((a) => a.leafKey === selectedLeaf)) {
            selectedLeaf = null;
          }
          render();
        }

        // ---- file picking ---------------------------------------------------

        els.file.addEventListener("change", () => {
          const f = els.file.files && els.file.files[0];
          if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
          picked = null;
          els.fileNote.classList.add("hidden");
          if (!f) { render(); return; }

          if (f.size > MAX_BYTES) {
            banner("bad", "That image is larger than 25 MB. Nothing was uploaded.");
            els.file.value = "";
            render();
            return;
          }
          picked = f;
          previewUrl = URL.createObjectURL(f);
          banner("", "");

          // HEIC is stored happily by fly; the warning is about what the agent
          // can then open. Refusing a file fly can perfectly well store, on a
          // guess about the agent's image reader, would be the wrong call.
          const heic = /heic|heif/i.test(f.type) || /\.hei[cf]$/i.test(f.name || "");
          if (heic) {
            els.fileNote.textContent =
              "This is a HEIC photo. It will be saved, but the agent may not be able to open it — a screenshot (PNG) is safer.";
            els.fileNote.classList.remove("hidden");
          }
          render();
        });

        // ---- sending --------------------------------------------------------

        // No upload progress bar: fetch cannot report it, streaming request
        // bodies are unsupported in Safari, and the portable fallback would mean
        // rewriting this on XMLHttpRequest for a transfer that takes about a
        // second on a tailnet. An indeterminate spinner plus a disabled button
        // is the better spend.
        const MESSAGES = {
          askPending: "That agent is waiting on a question at the machine. Answer it there first — nothing was sent.",
          paneChanged: "That session was replaced since the list loaded. Pick it again — nothing was sent.",
          notAgent: "That pane isn't running an agent any more. Nothing was sent.",
          unknownAgent: "That agent is gone. Nothing was sent.",
          oversize: "That image is too large. Nothing was saved.",
          badFormat: "That file isn't an image fly recognizes. Nothing was saved.",
          badRequest: "fly couldn't read that request. Nothing was sent.",
          captionTooLong: "That caption is too long — trim it and try again.",
          queryTooLong: "That caption is too long — trim it and try again.",
          storageFailed: "fly couldn't save the image. Nothing was sent.",
          deliveryFailed: "fly saved the image but couldn't type into the pane.",
          deliverySubmitFailed: "The text is already typed into the pane — press Enter at the machine to send it.",
        };

        els.send.addEventListener("click", async () => {
          const a = selected();
          if (!picked || !a || sending) return;
          sending = true;
          banner("", "");
          render();

          const params = new URLSearchParams();
          params.set("agent", a.leafKey);
          params.set("pane", String(a.paneId));
          const cap = els.caption.value.trim().slice(0, CAPTION_MAX);
          if (cap) params.set("caption", cap);

          try {
            const res = await fetch(DROP_URL + "?" + params.toString(), {
              method: "POST",
              headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/octet-stream",
              },
              body: picked,
            });
            if (res.ok) {
              // Landed: clear the image but KEEP the agent selection, so a
              // second screenshot to the same agent is one tap (AE11).
              if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
              picked = null;
              els.file.value = "";
              els.caption.value = "";
              els.fileNote.classList.add("hidden");
              banner("ok", "Sent to " + (a.workspace || "?") + " / " + (a.tab || "?") + ".");
            } else if (res.status === 401) {
              token = "";
              store.clear();
              banner("bad", "That token was rejected. Paste it again.");
            } else {
              // Refused or failed: KEEP the image and caption, so retrying
              // against another agent doesn't mean re-picking from the camera
              // roll.
              let code = "";
              try { code = (await res.json()).error || ""; } catch { /* no body */ }
              banner("bad", MESSAGES[code] || ("fly refused that (" + res.status + ")."));
            }
          } catch {
            banner("bad", "Couldn't reach fly. The image is still attached — try again.");
          } finally {
            sending = false;
            render();
          }
        });

        // ---- token entry ----------------------------------------------------

        els.saveToken.addEventListener("click", () => {
          const v = els.token.value.trim();
          if (!v) return;
          token = v;
          store.set(v);
          els.token.value = "";
          banner("", "");
          render();
          streamRoster();
        });
        els.token.addEventListener("keydown", (e) => {
          if (e.key === "Enter") els.saveToken.click();
        });

        // Re-evaluate staleness on a slow tick so a frozen webview surfaces
        // even while no frames arrive.
        setInterval(() => { if (token && connected) render(); }, 3000);

        render();
        if (token) streamRoster();
      })();
    </script>
  </body>
</html>
