[package]
name = "fly"
version = "0.1.0"
description = "A terminal for AI coding agents"
authors = ["Evan"]
edition = "2021"
rust-version = "1.77"

# The library powers both the Tauri app and the `fly` CLI subcommands.
# `rlib` lets integration tests and the binary link against it.
[lib]
name = "fly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rand = "0.8"
subtle = "2"
libc = "0.2"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
