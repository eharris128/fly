[package]
name = "fly"
version = "0.2.0"
description = "A terminal for AI coding agents"
authors = ["Evan"]
edition = "2021"
rust-version = "1.77"

# The library powers both the Tauri app and the `fly` CLI subcommands.
# `rlib` lets integration tests and the binary link against it.
[lib]
name = "fly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Electron-shell migration U2: the control-socket registry runs the async
# usage fetch on a local current-thread runtime (already in-tree via tauri).
tokio = { version = "1", features = ["rt"] }
# Usage panel (dashboard) — calls Claude Code's own /api/oauth/usage endpoint.
# reqwest is already in the tree via Tauri but built without TLS; `json` keeps
# default features (incl. default-tls via system openssl, already a build dep).
reqwest = { version = "0.13", features = ["json"] }
portable-pty = "0.9"
# Automations (docs/plans/2026-07-01-002, KTD-A): croner is the 5-field cron
# engine with a documented DST contract; chrono-tz supplies the IANA zones all
# occurrence math must stay in (never naive-then-convert).
croner = "3"
chrono = "0.4"
chrono-tz = "0.10"
rand = "0.8"
subtle = "2"
libc = "0.2"
log = "0.4"
# Local read-only feed (feat-agent-state-local-feed): a minimal, synchronous,
# thread-per-connection HTTP server — matches fly's existing (non-async) socket
# idiom rather than pulling in an async runtime for one read endpoint.
tiny_http = "0.12"
# Screen-derived pending-question fallback (feed-question-screen-fallback
# KTD2): vte tokenizes the raw PTY byte stream (the error-prone part — UTF-8 +
# CSI/OSC/DCS framing); the grid semantics on top are ours, deliberately
# minimal and abstain-on-surprise.
vte = "0.13"

[dev-dependencies]
tempfile = "3"

# Debug symbols dominate this target dir, and they scale with BINARY COUNT, not
# with the dependency graph: every integration test links the whole crate graph
# statically, so the same DWARF is written once per test binary. Measured
# 2026-07-31 at 13G total — 430 dependency rlibs were only 1.6G of it, while 16
# unstripped test/bin executables averaging ~250MB came to 3.9G, plus 870M of
# libfly_lib.a. line-tables-only keeps file/line backtraces (what panics and the
# test harness actually need) and drops the per-variable DWARF that was being
# duplicated; unpacked split-debuginfo moves what remains out of the binaries
# into .dwo files the linker can share. Cost: no variable inspection under a
# debugger — raise to `debug = true` locally and temporarily if you need it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Fast local release bundle (`pnpm build:local`): thin LTO + parallel codegen
# trade a few % binary size for a much shorter build. Shipping builds keep
# the fat-LTO `release` profile above.
#
# Semantics DELIBERATELY diverge from `release` on one axis (audit-remediation
# U3/KTD3): overflow-checks are ON here so local iteration catches silent
# integer wrap (the recorded iso8601-parser bug class, invisible to the
# checked dev/test profiles' suites once shipped). The shipping `release`
# profile keeps them OFF on purpose: with `panic = "abort"` a wrap would
# become an abort that kills every live agent pane at once — bounded/checked
# arithmetic on untrusted numeric input remains the shipping defense.
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
overflow-checks = true
